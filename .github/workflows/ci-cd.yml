# CI/CD for the site: lint, build, test, audit, then deploy to GitHub Pages.
# Nothing reaches Pages unless every job passed on main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job starts with no permissions and asks only for what it needs.
permissions: {}

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Content schema, ESLint, Stylelint
        run: npm run lint
      - name: Install pinned linters (SHA-256 verified)
        run: scripts/ci/install-tools.sh actionlint hadolint kubeconform kustomize
      - name: actionlint (workflows, with ShellCheck on every run block)
        run: actionlint -color
      - name: hadolint (Dockerfile)
        run: hadolint Dockerfile
      - name: ShellCheck (scripts)
        run: shellcheck scripts/*.sh scripts/ci/*.sh
      - name: yamllint
        run: |
          yamllint --version || pipx install yamllint==1.38.0
          yamllint --strict .
      - name: kubeconform (kustomize overlays and Argo CD, CRDs included)
        run: scripts/ci/validate-manifests.sh

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dependencies: build
      - name: Read the GitHub Pages URL
        id: pages
        # Fails until Pages is enabled; the build then falls back to the default github.io URL.
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site (reproducible, dated from the commit)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          npm run build
          {
            echo "### Build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Site URL | $SITE_URL |"
            echo "| Pages | $(find dist -name '*.html' | wc -l) HTML files, man pages: $(find dist -name '*.1' | wc -l) |"
            echo "| Size | $(du -sh dist | cut -f1) |"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the site for the test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Upload the GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Keeps .well-known/security.txt.
          include-hidden-files: true

  test:
    name: Test (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: HTML validation, internal links and fragments, man page lint
        if: matrix.project == 'desktop'
        run: |
          npm run test:html
          npm run test:links
          sudo apt-get install -y --no-install-recommends mandoc >/dev/null
          npm run test:man
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (Playwright + axe)
        env:
          PROJECT: ${{ matrix.project }}
        run: npx playwright test --project="$PROJECT"
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Lighthouse (budgets in lighthouserc.json)
        run: |
          npx lhci collect
          npx lhci assert
      - name: Publish the reports (temporary public storage)
        if: always()
        # A storage outage must not fail the build: the budgets above are what gates it.
        continue-on-error: true
        run: npx lhci upload
      - name: Scores in the job summary
        if: always()
        run: node scripts/ci/lighthouse-summary.mjs >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a commit SHA, not a tag: in March 2026 the tags of this action were
      # force-pushed to malicious commits (CVE-2026-33634). A SHA cannot be moved.
      - name: Trivy (vulnerabilities, secrets, misconfigurations) to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
      - name: Upload Trivy results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy gate (fails on fixable HIGH or CRITICAL findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-setup-trivy: true
      - uses: ./.github/actions/setup
        with:
          dependencies: build
      - name: npm audit (build dependencies)
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy
    needs: [lint, build, test, lighthouse, audit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Deployed to $PAGE_URL (exit 0)." >>"$GITHUB_STEP_SUMMARY"
