# Proves the network policies on a real cluster: kind + Cilium, on every relevant change
# and every week (to catch drift in Cilium, kind or the base images).
name: Zero Trust e2e

on:
  push:
    branches: [main]
    paths: &paths
      - Dockerfile
      - deploy/**
      - content/**
      - scripts/**
      - src/**
      - tests/load/**
      - .github/workflows/zero-trust-e2e.yml
  pull_request:
    paths: *paths
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: zero-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Zero Trust e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (loaded into Docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: localhost/portfolio:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kind, cilium-cli and k6 (SHA-256 verified)
        run: scripts/ci/install-tools.sh kind cilium k6

      - name: Create the cluster and install Cilium
        run: scripts/ci/zero-trust-e2e.sh up

      - name: Deploy the site and the test clients
        run: scripts/ci/zero-trust-e2e.sh deploy

      - name: Prove the policies (L3/L4, L7, egress, pod hardening)
        run: scripts/ci/zero-trust-e2e.sh test

      - name: Load test with k6
        run: scripts/ci/zero-trust-e2e.sh load

      - name: Hubble evidence in the job summary
        if: always()
        run: scripts/ci/zero-trust-e2e.sh evidence

      - name: Diagnostics
        if: failure()
        run: scripts/ci/zero-trust-e2e.sh diagnostics
