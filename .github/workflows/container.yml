# Container supply chain: build, smoke-test, scan, push, sign, SBOM, provenance.
# Pull requests build and scan the image but never push it.
name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/docker/**
      - content/**
      - scripts/**
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/container.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing (Sigstore) and provenance
      attestations: write # GitHub build provenance attestation
      security-events: write # Trivy results to code scanning
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and reproducible timestamp
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=guerd(1)
            org.opencontainers.image.description=Nawal Guerd's portfolio, served by unprivileged nginx

      - name: Build for scanning (linux/amd64, loaded into Docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: localhost/portfolio:scan
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.vars.outputs.epoch }}
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (read-only root filesystem, no capabilities, non-root)
        run: |
          docker run -d --name web --read-only --tmpfs /tmp:rw,size=16m \
            --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 localhost/portfolio:scan
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/fr/
          curl -fsSI http://127.0.0.1:8080/ | grep -i '^content-security-policy: default-src'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/)" = 405
          test "$(docker exec web id -u)" = 101
          docker rm -f web

      - name: Trivy image scan to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: localhost/portfolio:scan
          format: sarif
          output: trivy-image.sarif
      - name: Upload Trivy results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy gate (fails on a fixable CRITICAL vulnerability)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: localhost/portfolio:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-setup-trivy: true

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.vars.outputs.epoch }}
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign the image (keyless, GitHub OIDC + Sigstore)
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: SBOM (SPDX, Syft)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - name: Attach the SBOM as a signed attestation
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: SLSA build provenance (GitHub attestation)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records only exist for organization-owned repositories.
          create-storage-record: false

      - name: Verify the signature like anyone else would
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          TAGS: ${{ steps.meta.outputs.tags }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # github.workflow_ref is "owner/repo/.github/workflows/container.yml@refs/heads/main".
          cosign verify "$REF" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          {
            echo "### Image published and signed"
            echo
            echo "\`$REF\`"
            echo
            echo "Tags: $(echo "$TAGS" | tr '\n' ' ')"
            echo
            echo '```sh'
            echo "cosign verify $REF \\"
            echo "  --certificate-identity \"$IDENTITY\" \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://$REF --owner $OWNER"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
