extends: default

ignore: |
  node_modules/
  dist/
  build/
  .lighthouseci/
  test-results/
  playwright-report/

rules:
  document-start: disable
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  line-length:
    max: 160
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
