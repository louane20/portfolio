about:
  heading: { en: About, fr: Profil, ar: نبذة عني }
  paragraphs:
    - en: >-
        I'm a DevOps engineer at **ATM Mobilis**, Algeria's national mobile network operator, where
        I build and run the infrastructure applications are delivered on: production Kubernetes
        clusters on bare metal across several datacenters, some of them air-gapped, with GitLab
        CI/CD and Argo CD for delivery, Ansible for automation and Cilium for the network.
      fr: >-
        Je suis ingénieure DevOps chez **ATM Mobilis**, l'opérateur national de téléphonie mobile en
        Algérie. J'y construis et j'exploite l'infrastructure sur laquelle les applications sont
        livrées : des clusters Kubernetes de production sur bare metal, répartis sur plusieurs
        datacenters, certains isolés d'Internet, avec GitLab CI/CD et Argo CD pour la livraison,
        Ansible pour l'automatisation et Cilium pour le réseau.
      ar: >-
        أعمل مهندسة DevOps في **ATM Mobilis**، المتعامل الوطني للهاتف النقال في الجزائر، حيث أبني
        البنية التحتية التي تُسلَّم عليها التطبيقات وأشغّلها: عناقيد Kubernetes للإنتاج على خوادم
        فعلية (bare metal) موزعة على عدة مراكز بيانات، بعضها معزول عن الإنترنت، مع GitLab CI/CD
        وArgo CD للتسليم، وAnsible للأتمتة، وCilium للشبكة.
    - en: >-
        What I enjoy most is cloud-native infrastructure and automation. When a task has to be done
        twice, I write it down as code: servers configured with Ansible, deployments declared in Git
        and synced by Argo CD, secrets kept in Vault. The goal is infrastructure that anyone on the
        team can rebuild, review and rerun.
      fr: >-
        Ce que je préfère, c'est l'infrastructure cloud-native et l'automatisation. Dès qu'une tâche
        doit être faite deux fois, je l'écris sous forme de code : serveurs configurés avec Ansible,
        déploiements déclarés dans Git et synchronisés par Argo CD, secrets rangés dans Vault.
        L'objectif : une infrastructure que n'importe qui dans l'équipe peut reconstruire, relire et
        relancer.
      ar: >-
        أكثر ما أحبه هو البنية التحتية السحابية الأصلية والأتمتة. فكل مهمة يجب تكرارها أكتبها على
        شكل رمز: خوادم مهيأة بـ Ansible، وعمليات نشر مصرّح بها في Git تزامنها Argo CD، وأسرار محفوظة
        في Vault. والهدف: بنية تحتية يستطيع أي فرد في الفريق إعادة بنائها ومراجعتها وإعادة تشغيلها.
    - en: >-
        My background is security: a master's in computer systems security and two years of
        research on Zero Trust for cloud-native 5G, published at **IEEE WCNC 2025**. So security is
        part of the design, not a patch: I decide who can reach each service before it goes live. I
        work every day with development, security, network and infrastructure teams, and I document
        what I build.
      fr: >-
        Je viens de la sécurité : un master en sécurité des systèmes informatiques et deux ans de
        recherche sur le Zero Trust pour la 5G cloud-native, publiés à **IEEE WCNC 2025**. La
        sécurité fait donc partie de la conception, ce n'est pas un correctif : je définis qui peut
        joindre chaque service avant sa mise en production. Je travaille chaque jour avec les
        équipes développement, sécurité, réseau et infrastructure, et je documente ce que je
        construis.
      ar: >-
        خلفيتي في الأمن: ماستر في أمن الأنظمة المعلوماتية وسنتان من البحث في Zero Trust لشبكات الجيل
        الخامس السحابية، توّجتا بورقة منشورة في **IEEE WCNC 2025**. لذلك فالأمن جزء من التصميم وليس
        ترقيعًا لاحقًا: أحدد من يمكنه الوصول إلى كل خدمة قبل وضعها في الإنتاج. أعمل يوميًا مع فرق
        التطوير والأمن والشبكات والبنية التحتية، وأوثّق ما أبنيه.
  community:
    heading: { en: Open source and community, fr: Open source et communauté, ar: المصادر المفتوحة والمجتمع }
    items:
      - en: >-
          IT team leader of the Openminds open-source club at USTHB (2020–2023). Organized Install
          Party 10 and Hacktoberfest, and ran workshops on open-source tools.
        fr: >-
          Responsable de l'équipe IT du club open source Openminds à l'USTHB (2020–2023).
          Organisation de l'Install Party 10 et de Hacktoberfest, ateliers sur les outils open
          source.
        ar: >-
          مسؤولة الفريق التقني في نادي المصادر المفتوحة Openminds بجامعة هواري بومدين (2020–2023).
          نظّمت Install Party 10 وHacktoberfest، وقدّمت ورشات حول أدوات المصادر المفتوحة.
      - en: Capture-the-flag competitions, technical writing and research conferences.
        fr: Compétitions de type CTF, rédaction technique et conférences de recherche.
        ar: مسابقات من نوع CTF، والكتابة التقنية، والمؤتمرات البحثية.

expertise:
  heading: { en: Expertise, fr: Expertise, ar: الخبرات التقنية }
  intro:
    en: >-
      Cloud-native infrastructure, automation and delivery: the tools I run in production at ATM
      Mobilis, and the ones I have used elsewhere.
    fr: >-
      Infrastructure cloud-native, automatisation et livraison : les outils que j'exploite en
      production chez ATM Mobilis, et ceux que j'ai utilisés ailleurs.
    ar: >-
      البنية التحتية السحابية الأصلية والأتمتة والتسليم: الأدوات التي أشغّلها في الإنتاج لدى ATM
      Mobilis، وتلك التي استخدمتها في سياقات أخرى.
  areas:
    - id: kubernetes
      title:
        {
          en: Kubernetes and cloud-native platforms,
          fr: Kubernetes et plateformes cloud-native,
          ar: Kubernetes والمنصات السحابية الأصلية
        }
      text:
        en: >-
          Build and operate production clusters with kubeadm on bare metal, including air-gapped
          environments reachable only through a DMZ and gateway components.
        fr: >-
          Construction et exploitation de clusters de production avec kubeadm sur bare metal, y
          compris dans des environnements isolés joignables uniquement via une DMZ et des
          passerelles.
        ar: >-
          بناء عناقيد الإنتاج وتشغيلها باستخدام kubeadm على خوادم فعلية، بما في ذلك البيئات المعزولة
          التي لا يمكن الوصول إليها إلا عبر منطقة DMZ وبوابات.
      production: [ Kubernetes, kubeadm ]
      other: [ containerd, Docker, Docker Compose, Linux ]
    - id: automation
      title:
        {
          en: Automation and infrastructure as code,
          fr: Automatisation et infrastructure as code,
          ar: الأتمتة والبنية التحتية كرمز
        }
      text:
        en: >-
          Provision and configure servers and clusters as code, so that every environment can be
          rebuilt, reviewed and rerun, with secrets kept out of the repositories.
        fr: >-
          Provisioning et configuration des serveurs et des clusters sous forme de code, pour que
          chaque environnement puisse être reconstruit, relu et relancé, sans aucun secret dans les
          dépôts.
        ar: >-
          تهيئة الخوادم والعناقيد وإعدادها على شكل رمز، حتى يمكن إعادة بناء كل بيئة ومراجعتها وإعادة
          تشغيلها، دون أي أسرار داخل المستودعات.
      production: [ Ansible, HashiCorp Vault ]
      other: [ Python, Shell scripting ]
    - id: gitops
      title: { en: CI/CD and GitOps, fr: CI/CD et GitOps, ar: CI/CD وGitOps }
      text:
        en: >-
          Design controlled, auditable delivery: pipelines that build, test and scan every change,
          and Git as the single source of truth for what runs in the cluster.
        fr: >-
          Conception d'une livraison contrôlée et traçable : des pipelines qui construisent, testent
          et scannent chaque changement, et Git comme source unique de vérité pour ce qui tourne dans
          le cluster.
        ar: >-
          تصميم تسليم مضبوط وقابل للتتبع: خطوط تبني كل تغيير وتختبره وتفحصه، وGit كمصدر وحيد للحقيقة
          لما يعمل داخل العنقود.
      production: [ GitLab CI/CD, Argo CD ]
      other: [ GitHub Actions, Trivy, cosign ]
    - id: traffic
      title:
        {
          en: Networking and high availability,
          fr: Réseau et haute disponibilité,
          ar: الشبكات والتوافر العالي
        }
      text:
        en: >-
          Expose and load-balance services on bare-metal clusters, and contribute to
          multi-datacenter architectures with high-availability requirements.
        fr: >-
          Exposition et répartition de charge des services sur des clusters bare metal, et
          contribution à des architectures multi-datacenters à haute disponibilité.
        ar: >-
          كشف الخدمات وموازنة الحمل على عناقيد bare metal، والمساهمة في معماريات متعددة مراكز
          البيانات عالية التوافر.
      production: [ MetalLB, F5, Kong, Nginx ]
      other: []
    - id: observability
      title:
        {
          en: Observability and data services,
          fr: Observabilité et services de données,
          ar: المراقبة وخدمات البيانات
        }
      text:
        en: >-
          Run the metrics and logging stack, load-test services to find their bottlenecks, and
          administer the stateful services platforms depend on.
        fr: >-
          Exploitation de la stack de métriques et de logs, tests de charge pour trouver les goulots
          d'étranglement, et administration des services avec état dont dépendent les plateformes.
        ar: >-
          تشغيل منظومة المقاييس والسجلات، واختبار تحمّل الخدمات لكشف نقاط الاختناق، وإدارة الخدمات
          ذات الحالة التي تعتمد عليها المنصات.
      production: [ Prometheus, Grafana, Loki, K6, Kafka (Strimzi), PostgreSQL, Redis ]
      other: [ Promtail, cAdvisor, Node Exporter, ClickHouse, Oracle ]
    - id: zero-trust
      title:
        {
          en: Security and Zero Trust,
          fr: Sécurité et Zero Trust,
          ar: الأمن وZero Trust
        }
      text:
        en: >-
          Enforce network policies and segmentation based on workload identity, backed by a security
          background in penetration testing and intrusion detection.
        fr: >-
          Application de politiques réseau et de segmentation fondées sur l'identité des charges,
          avec un bagage en sécurité : tests d'intrusion et détection d'intrusion.
        ar: >-
          تطبيق سياسات الشبكة والتجزئة المبنية على هوية أعباء العمل، مع خلفية في الأمن: اختبارات
          الاختراق وكشف التسلل.
      production: [ Cilium, Network policies ]
      other: [ Istio, Calico, Nmap, Wireshark, Snort, OpenVAS, OWASP ZAP ]
  also:
    - label: { en: Languages, fr: Langages, ar: لغات البرمجة }
      items: [ Python, Shell, Node.js, C, PHP ]
    - label: { en: Systems, fr: Systèmes, ar: الأنظمة }
      items: [ Linux, Windows Server, Active Directory ]
    - label: { en: Cloud and telecom, fr: Cloud et télécom, ar: السحابة والاتصالات }
      items: [ Microsoft Azure, 5G Core, RAN, O-RAN, 3GPP ]

