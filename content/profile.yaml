about:
  heading:
    en: I build the platforms other teams ship on, and I keep them closed by default.
    fr: Je construis les plateformes sur lesquelles les autres équipes livrent, fermées par défaut.
  paragraphs:
    - en: >-
        I'm a DevOps engineer at **ATM Mobilis**, the Algerian mobile operator, where I deploy and
        operate production Kubernetes platforms end to end: clusters built with kubeadm, GitOps
        delivery with Argo CD and GitLab CI/CD, automation with Ansible and network security with
        Cilium. Much of it runs in air-gapped, multi-datacenter environments, where “it works on
        my machine” is not an answer.
      fr: >-
        Je suis ingénieure DevOps chez **ATM Mobilis**, l'opérateur mobile algérien, où je déploie
        et j'exploite des plateformes Kubernetes de production de bout en bout : clusters montés
        avec kubeadm, livraison GitOps avec Argo CD et GitLab CI/CD, automatisation avec Ansible et
        sécurité réseau avec Cilium. Une bonne partie tourne dans des environnements isolés
        (air-gapped) et multi-datacenters, où « ça marche sur ma machine » n'est pas une réponse.
    - en: >-
        Before that, I spent two years researching Zero Trust architectures for 5G networks during
        my master's in computer systems security. The work became a paper at **IEEE WCNC 2025**, and
        it left me with a habit: before anything goes live, I want to know exactly who is allowed
        to reach it, and why.
      fr: >-
        Avant cela, j'ai consacré deux ans à la recherche sur les architectures Zero Trust pour les
        réseaux 5G, pendant mon master en sécurité des systèmes informatiques. Ce travail a donné un
        article à **IEEE WCNC 2025**, et une habitude : avant toute mise en production, je veux
        savoir exactement qui a le droit d'y accéder, et pourquoi.
    - en: >-
        Day to day I work across development, security, network and infrastructure teams. I care
        about the unglamorous parts that keep a platform healthy: documentation, observability and
        pipelines anyone can rerun.
      fr: >-
        Au quotidien, je travaille avec les équipes développement, sécurité, réseau et
        infrastructure. Je soigne les parties peu glamour qui gardent une plateforme en bonne santé :
        la documentation, l'observabilité et des pipelines que n'importe qui peut relancer.
  environment:
    - key: ROLE
      value:
        en: DevOps engineer, ATM Mobilis
        fr: Ingénieure DevOps, ATM Mobilis
    - key: SINCE
      value:
        en: November 2024
        fr: novembre 2024
    - key: HOME
      value:
        en: El-Biar, Algiers
        fr: El-Biar, Alger
    - key: TZ
      value: Africa/Algiers (UTC+1)
    - key: LANG
      value:
        en: Arabic (native), French (fluent), English (proficient)
        fr: arabe (langue maternelle), français (courant), anglais (avancé)
    - key: STATUS
      value:
        en: Open to work
        fr: Disponible

skills:
  heading:
    en: What I work with, and where it has been used for real.
    fr: Ce avec quoi je travaille, et où je l'ai utilisé pour de vrai.
  intro:
    en: Grouped the way a platform is built, from the cluster up. Each option names its tools, then where they were used.
    fr: Regroupé comme on construit une plateforme, à partir du cluster. Chaque option cite ses outils, puis où ils ont servi.
  items:
    - id: kubernetes
      short: -k
      long: --kubernetes
      args: [kubeadm, containerd, Docker, Linux]
      text:
        en: >-
          Deploys and operates production clusters built with kubeadm, including air-gapped
          environments reachable only through DMZ and gateway components.
        fr: >-
          Déploie et exploite des clusters de production montés avec kubeadm, y compris dans des
          environnements isolés joignables uniquement via une DMZ et des passerelles.
      evidence: [atm-mobilis, cka-course]
    - id: air-gapped
      long: --air-gapped
      args: [DMZ, gateways, multi-datacenter, high availability]
      text:
        en: >-
          Runs platforms with no direct internet access, where every dependency and every
          connection crosses the DMZ on purpose. Contributes to multi-datacenter architectures with
          high-availability requirements.
        fr: >-
          Exploite des plateformes sans accès direct à Internet, où chaque dépendance et chaque
          connexion traverse la DMZ de façon délibérée. Contribue à des architectures
          multi-datacenters soumises à des exigences de haute disponibilité.
      evidence: [atm-mobilis]
    - id: gitops
      short: -g
      long: --gitops
      args: [Argo CD, GitLab CI/CD, Ansible, HashiCorp Vault]
      text:
        en: >-
          Designs GitOps workflows with Argo CD and GitLab CI/CD for controlled, auditable
          deployments, and automates provisioning and configuration with Ansible.
        fr: >-
          Conçoit des workflows GitOps avec Argo CD et GitLab CI/CD pour des déploiements contrôlés
          et traçables, et automatise le provisioning et la configuration avec Ansible.
      evidence: [atm-mobilis, gitlab-ci]
    - id: zero-trust
      short: -z
      long: --zero-trust
      args: [Cilium, Istio, NetworkPolicy, Calico, microsegmentation]
      text:
        en: >-
          Enforces Zero Trust network policies and segmentation with Cilium in production. Designed
          multi-layer microsegmentation that combines the CNI and the service mesh for 5G networks,
          published at IEEE WCNC 2025.
        fr: >-
          Applique des politiques réseau Zero Trust et de la segmentation avec Cilium en production.
          A conçu une microsegmentation multicouche combinant CNI et service mesh pour les réseaux
          5G, publiée à IEEE WCNC 2025.
      evidence: [atm-mobilis, wcnc-2025, msc]
    - id: ingress
      long: --ingress
      args: [MetalLB, Kong, Nginx, F5]
      text:
        en: >-
          Exposes and load-balances application traffic on bare-metal clusters with MetalLB, Kong,
          Nginx and F5.
        fr: >-
          Expose et répartit le trafic applicatif sur des clusters bare-metal avec MetalLB, Kong,
          Nginx et F5.
      evidence: [atm-mobilis]
    - id: observability
      short: -o
      long: --observability
      args: [Prometheus, Grafana, Loki, Promtail, K6]
      text:
        en: >-
          Runs the Prometheus, Grafana and Loki stack, load-tests with K6 and chases down the
          bottlenecks it finds.
        fr: >-
          Exploite la stack Prometheus, Grafana et Loki, réalise des tests de charge avec K6 et
          traque les goulots d'étranglement qu'ils révèlent.
      evidence: [atm-mobilis, bsc]
    - id: data
      long: --data
      args: [Kafka/Strimzi, PostgreSQL, Redis, ClickHouse, Oracle]
      text:
        en: >-
          Administers the distributed components platforms depend on: Kafka on Kubernetes with
          Strimzi, PostgreSQL and Redis, plus ClickHouse and Oracle.
        fr: >-
          Administre les composants distribués dont les plateformes dépendent : Kafka sur Kubernetes
          avec Strimzi, PostgreSQL et Redis, ainsi que ClickHouse et Oracle.
      evidence: [atm-mobilis]
    - id: security
      short: -s
      long: --security
      args: [Nmap, Wireshark, Snort, OpenVAS, OWASP ZAP, Kali Linux]
      text:
        en: >-
          Brings an offensive-security background to platform work: penetration testing,
          vulnerability assessment and intrusion detection, from a master's in computer systems
          security and a CyberTalents bootcamp.
        fr: >-
          Apporte un regard de sécurité offensive au travail de plateforme : tests d'intrusion,
          évaluation de vulnérabilités et détection d'intrusion, issus d'un master en sécurité des
          systèmes informatiques et d'un bootcamp CyberTalents.
      evidence: [pentest-usthb, snort, bootcamp, msc]
    - id: systems
      long: --systems
      args: [Linux, Windows Server, Active Directory, Python, Shell, Node.js, C, PHP]
      text:
        en: >-
          Works comfortably from the operating system up: Linux and Windows Server administration,
          Active Directory, and automation in Python and shell.
        fr: >-
          À l'aise du système d'exploitation jusqu'à l'application : administration Linux et Windows
          Server, Active Directory, automatisation en Python et en shell.
      evidence: [vpn, snort, ddos-sdn]
    - id: telecom
      long: --5g
      args: [5G Core, RAN, O-RAN, 3GPP]
      text:
        en: >-
          Understands 5G core and RAN architectures and their 3GPP security requirements, from two
          years of research on cloud-native 5G.
        fr: >-
          Connaît les architectures 5G cœur et RAN et leurs exigences de sécurité 3GPP, après deux
          ans de recherche sur la 5G cloud-native.
      evidence: [msc, wcnc-2025]

