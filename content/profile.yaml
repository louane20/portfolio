about:
  heading: { en: About, fr: Profil, ar: نبذة عني }
  paragraphs:
    - en: >-
        I'm a DevOps engineer at **ATM Mobilis**, a national mobile network operator in Algeria. I
        deploy and operate production Kubernetes platforms end to end: clusters built with kubeadm,
        GitOps delivery with Argo CD and GitLab CI/CD, automation with Ansible and network security
        with Cilium. Much of this runs in air-gapped, multi-datacenter environments.
      fr: >-
        Je suis ingénieure DevOps chez **ATM Mobilis**, opérateur national de téléphonie mobile en
        Algérie. Je déploie et j'exploite des plateformes Kubernetes de production de bout en bout :
        clusters montés avec kubeadm, livraison GitOps avec Argo CD et GitLab CI/CD, automatisation
        avec Ansible et sécurité réseau avec Cilium. Une grande partie de ce travail se fait dans
        des environnements isolés (air-gapped) et multi-datacenters.
      ar: >-
        أعمل مهندسة DevOps في **ATM Mobilis**، المتعامل الوطني للهاتف النقال في الجزائر. أنشر منصات
        Kubernetes للإنتاج وأشغّلها من البداية إلى النهاية: عناقيد مبنية بـ kubeadm، وتسليم عبر
        GitOps باستخدام Argo CD وGitLab CI/CD، وأتمتة باستخدام Ansible، وأمن الشبكات باستخدام
        Cilium. ويجري جزء كبير من هذا العمل في بيئات معزولة عن الإنترنت (air-gapped) ومتعددة مراكز
        البيانات.
    - en: >-
        Before that, I spent two years researching Zero Trust architectures for 5G networks during
        my master's in computer systems security, work that was published at **IEEE WCNC 2025**. It
        shaped how I build infrastructure: I decide who can reach each service before it goes live.
      fr: >-
        Auparavant, j'ai consacré deux ans à la recherche sur les architectures Zero Trust pour les
        réseaux 5G pendant mon master en sécurité des systèmes informatiques, un travail publié à
        **IEEE WCNC 2025**. Il a façonné ma façon de construire une infrastructure : je définis qui
        peut joindre chaque service avant sa mise en production.
      ar: >-
        قبل ذلك، خصصت سنتين للبحث في معماريات Zero Trust لشبكات الجيل الخامس خلال دراستي للماستر في
        أمن الأنظمة المعلوماتية، وقد نُشر هذا العمل في **IEEE WCNC 2025**. وقد شكّل طريقتي في بناء
        البنية التحتية: أحدد من يمكنه الوصول إلى كل خدمة قبل وضعها في الإنتاج.
    - en: >-
        I work every day with development, security, network and infrastructure teams. I care about
        what keeps a platform healthy over time: clear documentation, useful monitoring and
        pipelines that anyone on the team can rerun.
      fr: >-
        Je travaille chaque jour avec les équipes développement, sécurité, réseau et infrastructure.
        Je soigne ce qui garde une plateforme saine dans la durée : une documentation claire, une
        supervision utile et des pipelines que n'importe qui dans l'équipe peut relancer.
      ar: >-
        أعمل يوميًا مع فرق التطوير والأمن والشبكات والبنية التحتية. وأحرص على ما يحافظ على سلامة
        المنصة على المدى الطويل: توثيق واضح، ومراقبة مفيدة، وخطوط تسليم يستطيع أي فرد في الفريق
        إعادة تشغيلها.
  community:
    heading: { en: Open source and community, fr: Open source et communauté, ar: المصادر المفتوحة والمجتمع }
    items:
      - en: >-
          IT team leader of the Openminds open-source club at USTHB (2020–2023). Organized Install
          Party 10 and Hacktoberfest, and ran workshops on open-source tools.
        fr: >-
          Responsable de l'équipe IT du club open source Openminds à l'USTHB (2020–2023).
          Organisation de l'Install Party 10 et de Hacktoberfest, ateliers sur les outils open
          source.
        ar: >-
          مسؤولة الفريق التقني في نادي المصادر المفتوحة Openminds بجامعة هواري بومدين (2020–2023).
          نظّمت Install Party 10 وHacktoberfest، وقدّمت ورشات حول أدوات المصادر المفتوحة.
      - en: Capture-the-flag competitions, technical writing and research conferences.
        fr: Compétitions de type CTF, rédaction technique et conférences de recherche.
        ar: مسابقات من نوع CTF، والكتابة التقنية، والمؤتمرات البحثية.

expertise:
  heading: { en: Expertise, fr: Expertise, ar: الخبرات التقنية }
  intro:
    en: The tools I use, and the ones I run in production today at ATM Mobilis.
    fr: Les outils que j'utilise, et ceux que j'exploite aujourd'hui en production chez ATM Mobilis.
    ar: الأدوات التي أستخدمها، وتلك التي أشغّلها اليوم في الإنتاج لدى ATM Mobilis.
  areas:
    - id: kubernetes
      title: { en: Kubernetes platforms, fr: Plateformes Kubernetes, ar: منصات Kubernetes }
      text:
        en: >-
          Build and operate production clusters with kubeadm, including air-gapped environments
          reachable only through a DMZ and gateway components.
        fr: >-
          Construction et exploitation de clusters de production avec kubeadm, y compris dans des
          environnements isolés joignables uniquement via une DMZ et des passerelles.
        ar: >-
          بناء عناقيد الإنتاج وتشغيلها باستخدام kubeadm، بما في ذلك البيئات المعزولة التي لا يمكن
          الوصول إليها إلا عبر منطقة DMZ وبوابات.
      production: [ Kubernetes, kubeadm ]
      other: [ containerd, Docker, Docker Compose, Linux ]
    - id: gitops
      title: { en: GitOps and automation, fr: GitOps et automatisation, ar: GitOps والأتمتة }
      text:
        en: >-
          Design controlled, auditable delivery workflows and automate provisioning and
          configuration, with secrets kept out of the repositories.
        fr: >-
          Conception de workflows de livraison contrôlés et traçables, automatisation du
          provisioning et de la configuration, sans aucun secret dans les dépôts.
        ar: >-
          تصميم مسارات تسليم مضبوطة وقابلة للتتبع، وأتمتة التهيئة والإعداد، دون أي أسرار داخل
          المستودعات.
      production: [ Argo CD, GitLab CI/CD, Ansible, HashiCorp Vault ]
      other: [ GitHub Actions ]
    - id: zero-trust
      title:
        {
          en: Network security and Zero Trust,
          fr: Sécurité réseau et Zero Trust,
          ar: أمن الشبكات وZero Trust
        }
      text:
        en: >-
          Enforce network policies and segmentation based on workload identity, backed by an
          offensive-security background in penetration testing and intrusion detection.
        fr: >-
          Application de politiques réseau et de segmentation fondées sur l'identité des charges,
          avec un bagage en sécurité offensive : tests d'intrusion et détection d'intrusion.
        ar: >-
          تطبيق سياسات الشبكة والتجزئة المبنية على هوية أعباء العمل، مع خلفية في الأمن الهجومي:
          اختبارات الاختراق وكشف التسلل.
      production: [ Cilium, Network policies ]
      other: [ Istio, Calico, Nmap, Wireshark, Snort, OpenVAS, OWASP ZAP ]
    - id: traffic
      title:
        {
          en: Traffic and high availability,
          fr: Trafic et haute disponibilité,
          ar: حركة المرور والتوافر العالي
        }
      text:
        en: >-
          Expose and load-balance services on bare-metal clusters, and contribute to
          multi-datacenter architectures with high-availability requirements.
        fr: >-
          Exposition et répartition de charge des services sur des clusters bare-metal, et
          contribution à des architectures multi-datacenters à haute disponibilité.
        ar: >-
          كشف الخدمات وموازنة الحمل على عناقيد bare-metal، والمساهمة في معماريات متعددة مراكز
          البيانات عالية التوافر.
      production: [ MetalLB, F5, Kong, Nginx ]
      other: []
    - id: observability
      title: { en: Observability and performance, fr: Observabilité et performance, ar: المراقبة والأداء }
      text:
        en: >-
          Run the metrics and logging stack, load-test services and track down the bottlenecks those
          tests reveal.
        fr: >-
          Exploitation de la stack de métriques et de logs, tests de charge des services et
          résolution des goulots d'étranglement qu'ils révèlent.
        ar: >-
          تشغيل منظومة المقاييس والسجلات، واختبار تحمّل الخدمات، ومعالجة نقاط الاختناق التي تكشفها.
      production: [ Prometheus, Grafana, Loki, K6 ]
      other: [ Promtail, cAdvisor, Node Exporter ]
    - id: data
      title: { en: Data and messaging, fr: Données et messagerie, ar: البيانات والمراسلة }
      text:
        en: >-
          Administer the stateful components that platforms depend on, from event streaming to
          databases and caches.
        fr: >-
          Administration des composants avec état dont dépendent les plateformes, du streaming
          d'événements aux bases de données et aux caches.
        ar: >-
          إدارة المكونات ذات الحالة التي تعتمد عليها المنصات، من بث الأحداث إلى قواعد البيانات
          والذاكرات المؤقتة.
      production: [ Kafka (Strimzi), PostgreSQL, Redis ]
      other: [ ClickHouse, Oracle ]
  also:
    - label: { en: Languages, fr: Langages, ar: لغات البرمجة }
      items: [ Python, Shell, Node.js, C, PHP ]
    - label: { en: Systems, fr: Systèmes, ar: الأنظمة }
      items: [ Linux, Windows Server, Active Directory ]
    - label: { en: Telecom, fr: Télécom, ar: الاتصالات }
      items: [ 5G Core, RAN, O-RAN, 3GPP ]

