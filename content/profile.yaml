research:
  heading: { en: Research, fr: Recherche, ar: البحث العلمي }
  intro:
    en: Peer-reviewed work on Zero Trust security for cloud-native 5G networks.
    fr: Des travaux évalués par les pairs sur la sécurité Zero Trust des réseaux 5G cloud-native.
    ar: أعمال محكّمة حول أمن Zero Trust لشبكات الجيل الخامس السحابية.
  paper:
    title: A Multi-Layered Zero Trust Microsegmentation Solution for Cloud-Native 5G & Beyond Networks
    authors: [ Chafika Benzaïd, Nawal Guerd, Nour El Houda Rehouma, Khaled Zeraoulia, Tarik Taleb ]
    venue: 2025 IEEE Wireless Communications and Networking Conference (WCNC)
    short_venue: IEEE WCNC 2025
    location: { en: "Milan, Italy", fr: "Milan, Italie", ar: ميلانو، إيطاليا }
    dates: { en: March 2025, fr: mars 2025, ar: مارس 2025 }
    year: 2025
    pages: "1–7"
    doi: 10.1109/WCNC61545.2025.10978671
    open_access: https://zenodo.org/records/14699793
    open_access_license: CC BY 4.0
    bibtex_key: benzaid2025thaaloub
    summary:
      - en: >-
          Proposes **THAALOUB**, a 3GPP-compliant Zero Trust framework for end-to-end security in
          cloud-native 5G and beyond networks.
        fr: >-
          Propose **THAALOUB**, un framework Zero Trust conforme aux normes 3GPP pour une sécurité
          de bout en bout dans les réseaux 5G et au-delà, en architecture cloud-native.
        ar: >-
          يقترح **THAALOUB**، إطار عمل Zero Trust متوافقًا مع معايير 3GPP لتأمين شبكات الجيل الخامس
          وما بعده من طرف إلى طرف، في معمارية سحابية أصلية.
      - en: >-
          Combines the container network interface (CNI) and the service mesh into multi-layered
          microsegmentation, with intent-based access control.
        fr: >-
          Combine l'interface réseau des conteneurs (CNI) et le service mesh en une
          microsegmentation multicouche, avec un contrôle d'accès fondé sur l'intention.
        ar: >-
          يجمع بين واجهة شبكة الحاويات (CNI) وشبكة الخدمات (service mesh) في تجزئة دقيقة متعددة
          الطبقات، مع تحكم في الوصول مبني على النية.
      - en: >-
          Validated experimentally: a stronger security posture for minimal added latency and
          resource overhead.
        fr: >-
          Validé expérimentalement : une meilleure posture de sécurité pour un surcoût minimal en
          latence et en ressources.
        ar: >-
          تم التحقق منه تجريبيًا: وضع أمني أفضل مقابل كلفة إضافية ضئيلة في زمن الاستجابة والموارد.
    funding:
      en: Funded in part by the European Commission through the RIGOUROUS project (grant agreement
        101095933).
      fr: Financé en partie par la Commission européenne via le projet RIGOUROUS (convention de subvention
        101095933).
      ar: بتمويل جزئي من المفوضية الأوروبية عبر مشروع RIGOUROUS (اتفاقية المنحة 101095933).
  figure:
    title:
      en: How layered segmentation stops an attack
      fr: Comment une segmentation en couches arrête une attaque
      ar: كيف توقف التجزئة متعددة الطبقات هجومًا
    caption:
      en: >-
        A simplified example of the approach. A compromised worker tries to reach the database, and
        a legitimate frontend sends a request it should never send. Each layer stops the attack it
        can see.
      fr: >-
        Un exemple simplifié de l'approche. Un worker compromis tente de joindre la base de données,
        et un frontend légitime envoie une requête qu'il ne devrait jamais envoyer. Chaque couche
        arrête l'attaque qu'elle peut voir.
      ar: >-
        مثال مبسّط عن المقاربة. عامل مخترَق يحاول الوصول إلى قاعدة البيانات، وواجهة أمامية مشروعة
        ترسل طلبًا لا ينبغي لها أبدًا إرساله. كل طبقة توقف الهجوم الذي تستطيع رؤيته.
    panels:
      - id: flat
        title: { en: Flat network, fr: Réseau à plat, ar: شبكة مسطّحة }
        text:
          en: Every workload can reach every other one, on any port, with any request.
          fr: Chaque charge peut joindre toutes les autres, sur n'importe quel port, avec n'importe quelle
            requête.
          ar: كل عبء عمل يمكنه الوصول إلى جميع الأعباء الأخرى، على أي منفذ، وبأي طلب.
      - id: network
        title:
          {
            en: Network policies with Cilium,
            fr: Politiques réseau avec Cilium,
            ar: سياسات الشبكة مع Cilium
          }
        text:
          en: >-
            Default deny. Only declared connections between workload identities are allowed, so the
            worker's lateral movement is dropped in the kernel.
          fr: >-
            Refus par défaut. Seules les connexions déclarées entre identités de charges passent :
            le déplacement latéral du worker est bloqué dans le noyau.
          ar: >-
            الرفض افتراضيًا. لا تمر إلا الاتصالات المصرّح بها بين هويات أعباء العمل: الحركة الجانبية
            للعامل محظورة داخل النواة.
      - id: mesh
        title: { en: Adding a service mesh with Istio, fr: Avec un service mesh Istio, ar: مع شبكة خدمات Istio }
        text:
          en: >-
            Every connection carries a verified mTLS identity and each request is authorized, so the
            frontend cannot call an endpoint it does not need.
          fr: >-
            Chaque connexion porte une identité mTLS vérifiée et chaque requête est autorisée : le
            frontend ne peut pas appeler un point d'accès dont il n'a pas besoin.
          ar: >-
            كل اتصال يحمل هوية mTLS موثّقة وكل طلب يخضع للتفويض: لا تستطيع الواجهة الأمامية استدعاء
            نقطة وصول لا تحتاجها.
  thesis:
    title: Design and Implementation of a Zero Trust Security Solution for 5G Networks
    institution: USTHB
    year: 2024
    text:
      en: >-
        The master's thesis behind the paper: an automated deployment and cluster-management
        application for 5G infrastructure, with the Zero Trust policies implemented in Istio.
      fr: >-
        Le mémoire de master à l'origine de l'article : une application de déploiement automatisé et
        de gestion de clusters pour l'infrastructure 5G, avec des politiques Zero Trust mises en
        œuvre dans Istio.
      ar: >-
        مذكرة الماستر التي انبثقت عنها الورقة: تطبيق للنشر الآلي وإدارة العناقيد للبنية التحتية
        للجيل الخامس، مع سياسات Zero Trust مطبّقة في Istio.

projects:
  heading: { en: Projects, fr: Projets, ar: المشاريع }
  intro:
    en: A selection of work in infrastructure automation, cloud, networks and security.
    fr: Une sélection de travaux en automatisation d'infrastructure, cloud, réseaux et sécurité.
    ar: مختارات من أعمالي في أتمتة البنية التحتية والسحابة والشبكات والأمن.
  featured:
    title:
      en: This website, delivered like production software
      fr: Ce site, livré comme un logiciel de production
      ar: هذا الموقع، مُسلَّم كبرنامج إنتاج
    text:
      en: >-
        The site, and the PDF résumé, are generated from a single content file and go through a full
        delivery pipeline on every change: automated tests, accessibility and performance budgets,
        security scans, a signed container image, and a Kubernetes test where Cilium must prove the
        network policies. Only a fully green run is deployed.
      fr: >-
        Le site, et le CV en PDF, sont générés à partir d'un seul fichier de contenu et passent par
        un pipeline de livraison complet à chaque modification : tests automatisés, budgets
        d'accessibilité et de performance, scans de sécurité, image conteneur signée, et un test
        Kubernetes où Cilium doit prouver les politiques réseau. Seul un run entièrement vert est
        déployé.
      ar: >-
        يُولَّد الموقع، والسيرة الذاتية بصيغة PDF، من ملف محتوى واحد، ويمرّان عند كل تعديل بخط تسليم
        كامل: اختبارات آلية، وميزانيات للإتاحة والأداء، وفحوص أمنية، وصورة حاوية موقّعة، واختبار
        Kubernetes يجب أن يثبت فيه Cilium سياسات الشبكة. ولا يُنشر إلا التشغيل الناجح بالكامل.
    tags: [ GitHub Actions, Playwright, Trivy, cosign, kind, Cilium ]
  items:
    - id: 5g-automation
      year: 2024
      title:
        {
          en: Automated deployment of a cloud-native 5G platform,
          fr: Déploiement automatisé d'une plateforme 5G cloud-native,
          ar: النشر الآلي لمنصة جيل خامس سحابية أصلية
        }
      text:
        en: >-
          Master's thesis: an application that automates the deployment of a cloud-native 5G
          network on Kubernetes and the management of its clusters, with Zero Trust policies
          enforced by Istio. It led to the IEEE WCNC 2025 paper.
        fr: >-
          Mémoire de master : une application qui automatise le déploiement d'un réseau 5G
          cloud-native sur Kubernetes et la gestion de ses clusters, avec des politiques Zero Trust
          appliquées par Istio. À l'origine de l'article IEEE WCNC 2025.
        ar: >-
          مذكرة الماستر: تطبيق يؤتمت نشر شبكة جيل خامس سحابية أصلية على Kubernetes وإدارة عناقيدها،
          مع سياسات Zero Trust يطبّقها Istio. وهو العمل الذي انبثقت عنه ورقة IEEE WCNC 2025.
      tags: [ Kubernetes, Istio, Automation, 5G ]
    - id: azure-microservices
      year: 2024
      title:
        {
          en: Securing microservices on Azure,
          fr: Sécuriser des microservices sur Azure,
          ar: تأمين الخدمات المصغّرة على Azure
        }
      text:
        en: >-
          Compared Zero Trust, perimeter-based and DevSecOps approaches for microservices, then
          built a security framework for a microservices deployment on Microsoft Azure.
        fr: >-
          Comparaison des approches Zero Trust, périmétrique et DevSecOps pour les microservices,
          puis conception d'un cadre de sécurité pour un déploiement microservices sur Microsoft
          Azure.
        ar: >-
          مقارنة بين مقاربات Zero Trust والأمن المحيطي وDevSecOps للخدمات المصغّرة، ثم تصميم إطار
          أمني لنشر خدمات مصغّرة على Microsoft Azure.
      tags: [ Azure, Zero Trust, DevSecOps ]
    - id: ddos-sdn
      year: 2024
      title:
        {
          en: DDoS detection and mitigation in SDN,
          fr: Détection et mitigation DDoS dans un SDN,
          ar: كشف هجمات DDoS والتصدي لها في شبكة SDN
        }
      text:
        en: >-
          A software-defined network built with Mininet and the Ryu controller, with a Random Forest
          classifier that detects DDoS traffic and an automated, real-time mitigation module.
        fr: >-
          Un réseau SDN construit avec Mininet et le contrôleur Ryu, avec un classifieur Random
          Forest qui détecte le trafic DDoS et un module de mitigation automatique en temps réel.
        ar: >-
          شبكة SDN مبنية بـ Mininet ووحدة التحكم Ryu، مع مصنِّف Random Forest يكشف حركة DDoS ووحدة
          تصدٍّ آلي في الوقت الحقيقي.
      tags: [ Python, Mininet, Ryu, Machine learning ]
    - id: vpn
      year: 2024
      title: { en: Enterprise VPN deployment, fr: Déploiement d'un VPN d'entreprise, ar: نشر شبكة VPN للمؤسسة }
      text:
        en: >-
          A three-tier VPN architecture (client, Active Directory server and gateway) for
          authenticated, encrypted remote access.
        fr: >-
          Une architecture VPN à trois niveaux (client, serveur Active Directory et passerelle) pour
          un accès distant authentifié et chiffré.
        ar: >-
          معمارية VPN من ثلاثة مستويات (عميل، وخادم Active Directory، وبوابة) لوصول عن بُعد موثَّق
          ومشفَّر.
      tags: [ Windows Server, Active Directory, VPN ]
    - id: defender
      year: 2023
      title:
        {
          en: Endpoint protection on Azure,
          fr: Protection des postes sur Azure,
          ar: حماية محطات العمل على Azure
        }
      text:
        en: >-
          Compared enterprise antivirus solutions, then configured and tuned Microsoft Defender in
          Azure with custom security policies.
        fr: >-
          Comparaison de solutions antivirus d'entreprise, puis configuration et réglage de
          Microsoft Defender dans Azure avec des politiques de sécurité sur mesure.
        ar: >-
          مقارنة حلول مكافحة الفيروسات للمؤسسات، ثم إعداد Microsoft Defender وضبطه في Azure بسياسات
          أمنية مخصصة.
      tags: [ Azure, Endpoint security ]
    - id: security-labs
      year: 2024
      title:
        {
          en: Penetration testing and intrusion detection,
          fr: Tests d'intrusion et détection d'intrusion,
          ar: اختبارات الاختراق وكشف التسلل
        }
      text:
        en: >-
          Led a simulated black-box audit of the USTHB Faculty of Computer Science, from the
          engagement contract to the full report, and tuned Snort with custom rules to detect an
          attack simulated from Kali Linux on Windows Server.
        fr: >-
          Conduite d'un audit simulé en boîte noire de la Faculté d'informatique de l'USTHB, du
          contrat d'engagement au rapport complet, et réglage de Snort avec des règles sur mesure
          pour détecter une attaque simulée depuis Kali Linux sur Windows Server.
        ar: >-
          إجراء تدقيق محاكى بأسلوب الصندوق الأسود لكلية الإعلام الآلي بجامعة هواري بومدين، من عقد
          الالتزام إلى التقرير الكامل، وضبط Snort بقواعد مخصصة لكشف هجوم محاكى من Kali Linux على
          Windows Server.
      tags: [ Penetration testing, Snort, Kali Linux ]

