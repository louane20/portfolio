research:
  heading:
    en: Published research on Zero Trust microsegmentation for cloud-native 5G.
    fr: Recherche publiée sur la microsegmentation Zero Trust pour la 5G cloud-native.
  paper:
    title: A Multi-Layered Zero Trust Microsegmentation Solution for Cloud-Native 5G & Beyond Networks
    authors: [Chafika Benzaïd, Nawal Guerd, Nour El Houda Rehouma, Khaled Zeraoulia, Tarik Taleb]
    venue: 2025 IEEE Wireless Communications and Networking Conference (WCNC)
    short_venue: IEEE WCNC 2025
    location:
      en: Milan, Italy
      fr: Milan, Italie
    dates:
      en: 24–27 March 2025
      fr: 24–27 mars 2025
    year: 2025
    pages: "1–7"
    doi: 10.1109/WCNC61545.2025.10978671
    open_access: https://zenodo.org/records/14699793
    open_access_license: CC BY 4.0
    bibtex_key: benzaid2025thaaloub
    summary:
      - en: >-
          Proposes **THAALOUB**, a 3GPP-compliant Zero Trust framework for end-to-end security in
          cloud-native 5G and beyond networks.
        fr: >-
          Propose **THAALOUB**, un framework Zero Trust conforme aux normes 3GPP pour une sécurité de
          bout en bout dans les réseaux 5G et au-delà cloud-native.
      - en: >-
          Combines the service mesh and the container network interface (CNI) into multi-layered
          microsegmentation, with intent-based access control.
        fr: >-
          Combine le service mesh et le CNI (Container Network Interface) en une microsegmentation
          multicouche, avec un contrôle d'accès fondé sur l'intention.
      - en: >-
          Validated experimentally: a stronger security posture for minimal added latency and
          resource overhead.
        fr: >-
          Validé expérimentalement : une meilleure posture de sécurité pour un surcoût minimal en
          latence et en ressources.
    funding:
      en: Funded in part by the European Commission through the RIGOUROUS project (grant agreement 101095933).
      fr: Financé en partie par la Commission européenne via le projet RIGOUROUS (convention de subvention 101095933).
  thesis:
    title: Design and Implementation of a Zero Trust Security Solution for 5G Networks
    institution: USTHB
    year: 2024
    text:
      en: >-
        The master's thesis behind the paper: an automated deployment and cluster-management
        application for 5G infrastructure, with the Zero Trust policies implemented in Istio.
      fr: >-
        Le mémoire de master à l'origine de l'article : une application de déploiement automatisé
        et de gestion de clusters pour l'infrastructure 5G, avec les politiques Zero Trust mises en
        œuvre dans Istio.

projects:
  heading:
    en: Selected projects, written as the commands they would be.
    fr: Projets choisis, écrits comme les commandes qu'ils seraient.
  items:
    - id: portfolio
      year: 2026
      command: guerd deploy portfolio --gitops --signed --zero-trust
      title:
        en: This portfolio
        fr: Ce portfolio
      text:
        en: >-
          A static site generated from YAML, typeset as a man page and shipped by its own pipeline:
          end-to-end and accessibility tests, Lighthouse budgets, Trivy scans, a signed multi-arch
          image with an SBOM, and a kind cluster where Cilium proves the network policies on every
          change.
        fr: >-
          Un site statique généré à partir de YAML, composé comme une page de manuel et livré par
          son propre pipeline : tests de bout en bout et d'accessibilité, budgets Lighthouse,
          scans Trivy, image multi-architecture signée avec SBOM, et un cluster kind où Cilium
          prouve les politiques réseau à chaque changement.
      tags: [GitHub Actions, Cilium, kind, cosign, Playwright]
      link: repository
    - id: ddos-sdn
      year: 2024
      command: guerd detect --ddos --controller=ryu --model=random-forest
      title:
        en: DDoS detection and mitigation in SDN
        fr: Détection et mitigation DDoS dans un SDN
      text:
        en: >-
          Built a software-defined network with Mininet and the Ryu controller, generated a
          training dataset and trained a Random Forest classifier to detect DDoS traffic, with an
          automated, real-time mitigation module.
        fr: >-
          Mise en place d'un réseau SDN avec Mininet et le contrôleur Ryu, création d'un jeu de
          données d'entraînement et classification du trafic DDoS par Random Forest, avec un module
          de mitigation automatique en temps réel.
      tags: [Python, Mininet, Ryu, Random Forest]
    - id: azure-microservices
      year: 2024
      command: guerd compare zero-trust perimeter devsecops --cloud=azure
      title:
        en: Securing microservices in the cloud
        fr: Sécuriser des microservices dans le cloud
      text:
        en: >-
          Compared Zero Trust, perimeter-based and DevSecOps approaches for microservices, then
          built a security framework for a microservices architecture deployed on Microsoft Azure.
        fr: >-
          Comparaison des approches Zero Trust, périmétrique et DevSecOps pour les microservices,
          puis conception d'un cadre de sécurité pour une architecture microservices déployée sur
          Microsoft Azure.
      tags: [Azure, Zero Trust, DevSecOps]
    - id: pentest-usthb
      year: 2024
      command: guerd audit --black-box --scope=faculty-of-computer-science
      title:
        en: Black-box penetration test, USTHB
        fr: Test d'intrusion en boîte noire, USTHB
      text:
        en: >-
          Led a simulated security audit of the Faculty of Computer Science: drafted the
          engagement contract, ran black-box tests against industry standards and wrote the full
          audit report.
        fr: >-
          Conduite d'un audit de sécurité simulé de la Faculté d'informatique : rédaction du
          contrat d'engagement, tests en boîte noire selon les standards du secteur et rapport
          d'audit complet.
      tags: [Pentesting, Reporting]
    - id: snort
      year: 2024
      command: guerd detect --ids=snort --target=windows-server-2012r2
      title:
        en: Intrusion detection with Snort
        fr: Détection d'intrusion avec Snort
      text:
        en: >-
          Simulated an attack on Windows Server 2012 R2 from Kali Linux, then deployed and tuned
          Snort on Ubuntu with custom alert rules to detect it.
        fr: >-
          Simulation d'une attaque sur Windows Server 2012 R2 depuis Kali Linux, puis déploiement et
          réglage de Snort sur Ubuntu avec des règles d'alerte sur mesure pour la détecter.
      tags: [Snort, Kali Linux, Ubuntu]
    - id: vpn
      year: 2024
      command: guerd deploy vpn --tiers=client,active-directory,gateway
      title:
        en: Enterprise VPN deployment
        fr: Déploiement d'un VPN d'entreprise
      text:
        en: >-
          Designed a three-tier VPN architecture (client, Active Directory server and gateway) for
          secure remote access with proper authentication and encryption.
        fr: >-
          Conception d'une architecture VPN à trois niveaux (client, serveur Active Directory et
          passerelle) pour un accès distant sécurisé, authentifié et chiffré.
      tags: [Windows Server, Active Directory, VPN]
    - id: defender
      year: 2023
      command: guerd benchmark antivirus --tune=defender --cloud=azure
      title:
        en: Antivirus benchmark on Azure
        fr: Comparatif d'antivirus sur Azure
      text:
        en: >-
          Compared enterprise antivirus solutions, then configured and tuned Microsoft Defender in
          Azure with custom security policies.
        fr: >-
          Comparaison de solutions antivirus d'entreprise, puis configuration et réglage de
          Microsoft Defender dans Azure avec des politiques de sécurité sur mesure.
      tags: [Azure, Endpoint security]

