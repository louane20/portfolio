# The PDF résumé, in English and French (site.resume names the files). `npm run cv` renders it
# with scripts/render-cv.mjs from this section and from the rest of this file: experience, skills
# (expertise), education, research, credentials and languages. Text here may use **bold**.
cv:
  # One line under the title, packed with the keywords recruiters search for.
  keywords:
    en: Kubernetes · CI/CD & GitOps · Infrastructure as Code · Automation · Cloud-native · Security by design
    fr: Kubernetes · CI/CD & GitOps · Infrastructure as Code · Automatisation · Cloud-native · Security by design
  summary:
    en: >-
      DevOps engineer who loves **cloud-native infrastructure and automation**. Since November 2024
      I have built and run **production Kubernetes** platforms for Algeria's national mobile
      operator: bare-metal clusters across several datacenters, some of them air-gapped, delivered
      with **GitLab CI/CD and Argo CD**, automated with **Ansible** and secured with Cilium and
      Vault. A security background (M.Sc., IEEE WCNC 2025 paper on Zero Trust) means I design
      infrastructure that is secure from the first commit. Looking for a DevOps, cloud or platform
      engineering role where automation and reliability matter.
    fr: >-
