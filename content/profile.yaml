research:
  heading: { en: Research, fr: Recherche }
  intro:
    en: Peer-reviewed work on Zero Trust security for cloud-native 5G networks.
    fr: Des travaux évalués par les pairs sur la sécurité Zero Trust des réseaux 5G cloud-native.
  paper:
    title: A Multi-Layered Zero Trust Microsegmentation Solution for Cloud-Native 5G & Beyond Networks
    authors: [Chafika Benzaïd, Nawal Guerd, Nour El Houda Rehouma, Khaled Zeraoulia, Tarik Taleb]
    venue: 2025 IEEE Wireless Communications and Networking Conference (WCNC)
    short_venue: IEEE WCNC 2025
    location: { en: "Milan, Italy", fr: "Milan, Italie" }
    dates: { en: March 2025, fr: mars 2025 }
    year: 2025
    pages: "1–7"
    doi: 10.1109/WCNC61545.2025.10978671
    open_access: https://zenodo.org/records/14699793
    open_access_license: CC BY 4.0
    bibtex_key: benzaid2025thaaloub
    summary:
      - en: >-
          Proposes **THAALOUB**, a 3GPP-compliant Zero Trust framework for end-to-end security in
          cloud-native 5G and beyond networks.
        fr: >-
          Propose **THAALOUB**, un framework Zero Trust conforme aux normes 3GPP pour une sécurité de
          bout en bout dans les réseaux 5G et au-delà, en architecture cloud-native.
      - en: >-
          Combines the container network interface (CNI) and the service mesh into multi-layered
          microsegmentation, with intent-based access control.
        fr: >-
          Combine l'interface réseau des conteneurs (CNI) et le service mesh en une microsegmentation
          multicouche, avec un contrôle d'accès fondé sur l'intention.
      - en: >-
          Validated experimentally: a stronger security posture for minimal added latency and
          resource overhead.
        fr: >-
          Validé expérimentalement : une meilleure posture de sécurité pour un surcoût minimal en
          latence et en ressources.
    funding:
      en: Funded in part by the European Commission through the RIGOUROUS project (grant agreement 101095933).
      fr: Financé en partie par la Commission européenne via le projet RIGOUROUS (convention de subvention 101095933).
  figure:
    title:
      en: How layered segmentation stops an attack
      fr: Comment une segmentation en couches arrête une attaque
    caption:
      en: >-
        A simplified example of the approach. A compromised worker tries to reach the database, and
        a legitimate frontend sends a request it should never send. Each layer stops the attack it
        can see.
      fr: >-
        Un exemple simplifié de l'approche. Un worker compromis tente de joindre la base de données,
        et un frontend légitime envoie une requête qu'il ne devrait jamais envoyer. Chaque couche
        arrête l'attaque qu'elle peut voir.
    panels:
      - id: flat
        title: { en: Flat network, fr: Réseau à plat }
        text:
          en: Every workload can reach every other one, on any port, with any request.
          fr: Chaque charge peut joindre toutes les autres, sur n'importe quel port, avec n'importe quelle requête.
      - id: network
        title: { en: Network policies with Cilium, fr: Politiques réseau avec Cilium }
        text:
          en: >-
            Default deny. Only declared connections between workload identities are allowed, so the
            worker's lateral movement is dropped in the kernel.
          fr: >-
            Refus par défaut. Seules les connexions déclarées entre identités de charges passent :
            le déplacement latéral du worker est bloqué dans le noyau.
      - id: mesh
        title: { en: Adding a service mesh with Istio, fr: Avec un service mesh Istio }
        text:
          en: >-
            Every connection carries a verified mTLS identity and each request is authorized, so the
            frontend cannot call an endpoint it does not need.
          fr: >-
            Chaque connexion porte une identité mTLS vérifiée et chaque requête est autorisée : le
            frontend ne peut pas appeler un point d'accès dont il n'a pas besoin.
  thesis:
    title: Design and Implementation of a Zero Trust Security Solution for 5G Networks
    institution: USTHB
    year: 2024
    text:
      en: >-
        The master's thesis behind the paper: an automated deployment and cluster-management
        application for 5G infrastructure, with the Zero Trust policies implemented in Istio.
      fr: >-
        Le mémoire de master à l'origine de l'article : une application de déploiement automatisé et
        de gestion de clusters pour l'infrastructure 5G, avec des politiques Zero Trust mises en
        œuvre dans Istio.

projects:
  heading: { en: Projects, fr: Projets }
  intro:
    en: A selection of work in platform engineering, networks and security.
    fr: Une sélection de travaux en platform engineering, réseaux et sécurité.
  featured:
    title:
      en: This website, delivered like production software
      fr: Ce site, livré comme un logiciel de production
    text:
      en: >-
        The site is generated from a single content file and goes through a full delivery pipeline
        on every change: automated tests, accessibility and performance budgets, security scans, a
        signed container image, and a Kubernetes test where Cilium must prove the network policies.
        Only a fully green run is deployed.
      fr: >-
        Le site est généré à partir d'un seul fichier de contenu et passe par un pipeline de
        livraison complet à chaque modification : tests automatisés, budgets d'accessibilité et de
        performance, scans de sécurité, image conteneur signée, et un test Kubernetes où Cilium doit
        prouver les politiques réseau. Seul un run entièrement vert est déployé.
    tags: [GitHub Actions, Playwright, Trivy, cosign, kind, Cilium]
  items:
    - id: ddos-sdn
      year: 2024
      title: { en: DDoS detection and mitigation in SDN, fr: Détection et mitigation DDoS dans un SDN }
      text:
        en: >-
          A software-defined network built with Mininet and the Ryu controller, with a Random
          Forest classifier that detects DDoS traffic and an automated, real-time mitigation module.
        fr: >-
          Un réseau SDN construit avec Mininet et le contrôleur Ryu, avec un classifieur Random
          Forest qui détecte le trafic DDoS et un module de mitigation automatique en temps réel.
      tags: [Python, Mininet, Ryu, Machine learning]
    - id: azure-microservices
      year: 2024
      title: { en: Securing microservices on Azure, fr: Sécuriser des microservices sur Azure }
      text:
        en: >-
          Compared Zero Trust, perimeter-based and DevSecOps approaches for microservices, then
          built a security framework for a microservices deployment on Microsoft Azure.
        fr: >-
          Comparaison des approches Zero Trust, périmétrique et DevSecOps pour les microservices,
          puis conception d'un cadre de sécurité pour un déploiement microservices sur Microsoft Azure.
      tags: [Azure, Zero Trust, DevSecOps]
    - id: pentest-usthb
      year: 2024
      title: { en: Black-box penetration test, fr: Test d'intrusion en boîte noire }
      text:
        en: >-
          Led a simulated security audit of the USTHB Faculty of Computer Science, from the
          engagement contract to black-box testing and the full audit report.
        fr: >-
          Conduite d'un audit de sécurité simulé de la Faculté d'informatique de l'USTHB, du contrat
          d'engagement aux tests en boîte noire et au rapport d'audit complet.
      tags: [Penetration testing, Reporting]
    - id: snort
      year: 2024
      title: { en: Intrusion detection with Snort, fr: Détection d'intrusion avec Snort }
      text:
        en: >-
          Simulated an attack on Windows Server 2012 R2 from Kali Linux, then deployed and tuned
          Snort on Ubuntu with custom alert rules to detect it.
        fr: >-
          Simulation d'une attaque sur Windows Server 2012 R2 depuis Kali Linux, puis déploiement et
          réglage de Snort sur Ubuntu avec des règles d'alerte sur mesure pour la détecter.
      tags: [Snort, Kali Linux, Ubuntu]
    - id: vpn
      year: 2024
      title: { en: Enterprise VPN deployment, fr: Déploiement d'un VPN d'entreprise }
      text:
        en: >-
          A three-tier VPN architecture (client, Active Directory server and gateway) for
          authenticated, encrypted remote access.
        fr: >-
          Une architecture VPN à trois niveaux (client, serveur Active Directory et passerelle) pour
          un accès distant authentifié et chiffré.
      tags: [Windows Server, Active Directory, VPN]
    - id: defender
      year: 2023
      title: { en: Endpoint protection on Azure, fr: Protection des postes sur Azure }
      text:
        en: >-
          Compared enterprise antivirus solutions, then configured and tuned Microsoft Defender in
          Azure with custom security policies.
        fr: >-
          Comparaison de solutions antivirus d'entreprise, puis configuration et réglage de
          Microsoft Defender dans Azure avec des politiques de sécurité sur mesure.
      tags: [Azure, Endpoint security]

