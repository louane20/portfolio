# The blog (blog/ and fr/blog/). Posts are Markdown files in content/blog/.
blog:
  # Section of the home page that shows the latest posts.
  heading: { en: Writing, fr: Articles, ar: مقالات }
  intro:
    en: Notes from production and from research, with diagrams and working configuration.
    fr: Des notes tirées de la production et de la recherche, avec des schémas et des configurations qui
      fonctionnent.
    ar: ملاحظات من الإنتاج ومن البحث، مع مخططات وإعدادات تعمل فعلًا.
  # The blog's own page.
  title: { en: Notes from production, fr: Notes de production, ar: ملاحظات من الإنتاج }
  lede:
    en: >-
      Production Kubernetes, air-gapped platforms, operators, Zero Trust and open source. What I
      build, what breaks, and what I would do again.
    fr: >-
      Kubernetes en production, plateformes isolées d'Internet, opérateurs, Zero Trust et open
      source. Ce que je construis, ce qui casse, et ce que je referais.
    ar: >-
      Kubernetes في الإنتاج، ومنصات معزولة عن الإنترنت، والمشغّلات (operators)، وZero Trust،
      والمصادر المفتوحة. ما أبنيه، وما يتعطّل، وما سأكرره.
  description:
    en: >-
      Articles by Nawal Guerd on production Kubernetes, air-gapped platforms, Kubernetes operators,
      Zero Trust security and open source.
    fr: >-
      Articles de Nawal Guerd sur Kubernetes en production, les plateformes air-gapped, les
      opérateurs Kubernetes, la sécurité Zero Trust et l'open source.
    ar: >-
      مقالات Nawal Guerd حول Kubernetes في الإنتاج، والمنصات المعزولة عن الإنترنت، ومشغّلات
      Kubernetes، وأمن Zero Trust، والمصادر المفتوحة.
  author_bio:
    en: >-
      DevOps engineer at ATM Mobilis in Algiers. I build and secure production Kubernetes platforms,
      often air-gapped, and I co-authored an IEEE WCNC 2025 paper on Zero Trust for cloud-native 5G.
    fr: >-
      Ingénieure DevOps chez ATM Mobilis à Alger. Je construis et je sécurise des plateformes
      Kubernetes en production, souvent isolées d'Internet, et je suis co-autrice d'un article IEEE
      WCNC 2025 sur le Zero Trust pour la 5G cloud-native.
    ar: >-
      مهندسة DevOps في ATM Mobilis بالجزائر العاصمة. أبني منصات Kubernetes للإنتاج وأؤمّنها، وغالبًا
      ما تكون معزولة عن الإنترنت، وأنا مؤلفة مشاركة في ورقة IEEE WCNC 2025 حول Zero Trust لشبكات
      الجيل الخامس السحابية.

