      own GitHub Actions workflows. The status below comes live from the GitHub API.
    fr: >-
      Cette page est générée à partir de YAML, puis testée, auditée, empaquetée, signée et déployée
      par ses propres workflows GitHub Actions. Le statut ci-dessous vient en direct de l'API GitHub.

