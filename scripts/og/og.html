<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
  @font-face { font-family: "Red Hat Display"; src: url("../../src/fonts/red-hat-display.woff2") format("woff2"); font-weight: 300 900; }
  @font-face { font-family: "Red Hat Text"; src: url("../../src/fonts/red-hat-text.woff2") format("woff2"); font-weight: 300 700; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    padding: 64px 72px; background: #f5f7fa; color: #0f1c2e;
    font-family: "Red Hat Text", sans-serif;
    display: grid; grid-template-columns: 1fr 380px; gap: 56px; align-items: center;
  }
  .status { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px 8px 14px; border-radius: 999px; background: #e1f2e8; color: #157046; font-size: 22px; font-weight: 600; }
  .status i { width: 11px; height: 11px; border-radius: 50%; background: #157046; }
  h1 { margin: 30px 0 0; font-family: "Red Hat Display", sans-serif; font-size: 104px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
  .role { margin-top: 14px; color: #1a55a6; font-family: "Red Hat Display", sans-serif; font-size: 40px; font-weight: 600; }
  .pitch { margin-top: 26px; color: #435267; font-size: 26px; line-height: 1.45; max-width: 640px; }
  .card { padding: 30px; border: 1px solid #dbe2eb; border-radius: 22px; background: #fff; box-shadow: 0 20px 44px -18px rgb(15 28 46 / 22%); }
  .head { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid #dbe2eb; }
  .mono { width: 64px; height: 64px; border-radius: 50%; background: #1a55a6; color: #fff; display: grid; place-items: center; font-family: "Red Hat Display", sans-serif; font-size: 24px; font-weight: 800; }
  .head b { display: block; font-family: "Red Hat Display", sans-serif; font-size: 24px; }
  .head span:not(.mono) { color: #5a687c; font-size: 18px; }
  dl { margin: 0; }
  dl div { padding: 15px 0; border-bottom: 1px solid #dbe2eb; }
  dl div:last-child { border-bottom: 0; padding-bottom: 0; }
  dt { color: #5a687c; font-size: 16px; }
  dd { margin: 4px 0 0; font-size: 20px; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <span class="status"><i></i>Open to new opportunities</span>
    <h1>Nawal Guerd</h1>
    <div class="role">DevOps Engineer</div>
    <p class="pitch">Production Kubernetes, GitOps delivery and Zero Trust network security.</p>
  </div>
  <div class="card">
    <div class="head"><span class="mono">NG</span><div><b>Nawal Guerd</b><span>Algiers, Algeria</span></div></div>
    <dl>
      <div><dt>Current role</dt><dd>DevOps Engineer at ATM Mobilis</dd></div>
      <div><dt>Research</dt><dd>IEEE WCNC 2025 paper</dd></div>
      <div><dt>Education</dt><dd>M.Sc., Computer Systems Security</dd></div>
    </dl>
  </div>
</body>
</html>
