<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og post</title>
<link rel="stylesheet" href="../../src/styles/tokens.css">
<link rel="stylesheet" href="../../src/styles/covers.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    padding: 60px 64px; background: var(--bg); color: var(--ink);
    font-family: var(--font-text);
    display: grid; grid-template-columns: 1fr 520px; gap: 48px; align-items: center;
  }
  .cat-platform { --cat: var(--accent); }
  .cat-security { --cat: var(--ok); }
  .cat-delivery { --cat: var(--warn); }
  .cat-open-source { --cat: var(--violet); }
  .top { display: flex; align-items: center; gap: 16px; color: var(--ink-3); font: 600 21px var(--font-mono); }
  .cat { display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px 7px 13px; border-radius: 8px; background: color-mix(in srgb, var(--cat) 12%, var(--surface)); color: var(--cat); font-weight: 700; }
  .cat i { width: 11px; height: 11px; border-radius: 50%; background: var(--cat); }
  h1 { margin: 28px 0 0; font-family: var(--font-display); font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.12; }
  .author { display: flex; align-items: center; gap: 14px; margin-top: 40px; }
  .mono { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 700 20px var(--font-display); }
  .author b { display: block; font: 700 22px var(--font-display); }
  .author span span { color: var(--ink-3); font-size: 18px; }
  .art { width: 520px; height: 300px; overflow: hidden; border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 0 0 1px rgb(74 222 128 / 20%), 0 24px 50px -24px rgb(0 0 0 / 80%); }
</style>
</head>
<body>
  <div>
    <p class="top"><span class="cat" id="cat"><i></i><span id="cat-label"></span></span><span>Blog</span></p>
    <h1 id="title"></h1>
    <div class="author"><span class="mono">NG</span><span><b>Nawal Guerd</b><span>DevOps Engineer</span></span></div>
  </div>
  <div class="art" id="art"></div>
</body>
</html>
