# What Argo CD deploys (deploy/argocd/application.yaml).
# Pin the image by digest; `cosign verify` the digest before promoting it here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: portfolio
    count: 3
images:
  - name: portfolio
    newName: ghcr.io/louane20/portfolio
    newTag: main
patches:
  - target:
      kind: Deployment
      name: portfolio
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
