# nginx server for the portfolio image (nginxinc/nginx-unprivileged).
# The image already moves the pid file and temp paths to /tmp, so the container
# runs as uid 101 with a read-only root filesystem.
#
# add_header directives are NOT inherited by a location that defines its own,
# so every location that sets a header includes the security headers again.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/xml application/atom+xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/atom+xml image/svg+xml application/manifest+json;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted by esbuild: the name changes when the content does.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # guerd.1 and fr/guerd.1: readable in a browser, pipeable into `man -l -`.
    location ~ \.1$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ \.webmanifest$ {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
